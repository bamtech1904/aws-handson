---
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon Aurora DSQL Handson (Single-Region)'

Resources:
  # ハンズオン用のAurora DSQLクラスタ（単一リージョン）
  DsqlCluster:
    Type: AWS::DSQL::Cluster
    Properties:
      DeletionProtectionEnabled: false
      Tags:
        - Key: Name
          Value: aurora-dsql-handson-cluster

Outputs:
  ClusterIdentifier:
    Description: Aurora DSQLクラスタの識別子
    Value: !Ref DsqlCluster

  ClusterEndpoint:
    Description: Aurora DSQLクラスタの接続エンドポイント（psqlの--hostに指定）
    Value: !GetAtt DsqlCluster.Endpoint

  ClusterArn:
    Description: Aurora DSQLクラスタのARN
    Value: !GetAtt DsqlCluster.ResourceArn
